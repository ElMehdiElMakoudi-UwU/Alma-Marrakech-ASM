server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Coolify's proxy handles the domain and HTTPS, so redirects stay relative.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Built JS, CSS and fonts have a content hash in their name: safe to keep forever.
    location /assets/ {
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Image names don't change when the image does, so keep them for a week only.
    location /img/ {
        include snippets/headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # The page itself is always checked, so a new deployment shows up immediately.
    location / {
        include snippets/headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
